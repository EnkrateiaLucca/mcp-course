# Auth

## "Who is calling my server, and are they allowed?"

--

### stdio: never asked. The server was your own child process.

### HTTP: anyone on the network can send a request.

---
class: center, middle

# Two halves, one seam

<div class="flow">research_agent.py                      research_server.py
─────────────────                      ──────────────────
  sends one header       ──────►       one middleware checks it
  Authorization: Bearer &lt;token&gt;        before MCP sees anything

        MCP_AUTH_TOKEN                        MCP_AUTH_TOKEN
        (same value, both sides)</div>

<span class="file">research_server.py</span>
<span class="tag">auth · server half</span>

```python
AUTH_TOKEN = os.environ["MCP_AUTH_TOKEN"]   # fail fast if unset

class BearerAuthMiddleware(BaseHTTPMiddleware):
    async def dispatch(self, request, call_next):
*       header = request.headers.get("authorization", "")
*       if header != f"Bearer {AUTH_TOKEN}":
*           return JSONResponse({"error": "unauthorized"}, status_code=401)
        return await call_next(request)

app = mcp.streamable_http_app()
*app.add_middleware(BearerAuthMiddleware)
```

.muted[Runs on every request, before the MCP layer. Tool code never knows auth exists.]

# Every request

<div class="flow">HTTP request ──► BearerAuthMiddleware ──► header matches? ──► MCP layer ──► tool runs
                                              │
                                              └── no ──► 401  (MCP never sees it)</div>

# curl

```bash
# no header
curl -s -X POST http://127.0.0.1:8765/mcp \
  -H 'Content-Type: application/json' \
  -H 'Accept: application/json, text/event-stream' -d "$BODY"
```
.bad[→ 401 `{"error": "unauthorized"}`]

```bash
# right header
curl -s -X POST http://127.0.0.1:8765/mcp \
* -H 'Authorization: Bearer demo-secret' \
  -H 'Content-Type: application/json' \
  -H 'Accept: application/json, text/event-stream' -d "$BODY"
```
.ok[→ 200 initialize result]

---

# The auth ladder

| | Client gets token by | Server checks by | Use when |
|---|---|---|---|
| 0 · None | — | — | stdio on your laptop |
| **1 · Static bearer** | env var | string compare | one trusted caller |
| 2 · OAuth 2.1 | login flow → short-lived, scoped token | signature / introspection + scopes | many users, third-party hosts |

--

.big[**Rung 1 → rung 2: same header, same seam, zero tool changes.**]

class: center, middle

# OAuth in one slide

| Role | Who |
|---|---|
| Resource server | **your MCP server** (holds the tools) |
| Authorization server | Auth0 / Okta / your own (issues tokens) |
| Client | the MCP host: Claude, Cursor (runs the login) |

--

### OAuth changes *how the token is obtained and verified*.
### It does not change *where it travels* or *where it is checked*.
